automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code (desktop app)"
      tool_setup: >-
        A single Claude Code session with shell access to the Lean toolchain and Mathlib. The
        orchestrating agent read the PDF of the note, designed the challenge statements and a
        skeleton of all lemmas with `sorry`, and wrote parts of the proof itself (Section 7,
        the main assembly, the normalisation equivalence); self-contained files (Pollard's
        theorem, the circle Pollard inequality, the circle lemma, Sections 3-4, Section 5,
        Section 8) were delegated to parallel sub-agents of the same model, each compiling
        its file with `lake env lean`. Web access was used for the Palomar and comparator
        documentation and for the literature on Pollard's theorem.
      cost:
        wall_time: "about 2.5 hours (2026-09-26/27), with up to six agents in parallel"
        spend_usd: "subscription-based usage"
        hardware: "API-only (a laptop for compiling Lean)"
      prompting_notes: >-
        The user asked for a complete formalisation of the note, checked by the comparator,
        suitable for Palomar and for the Erdős problems website, in a public GitHub
        repository with a comparator CI job.
  spend_usd: "subscription-based usage"
  notes: >-
    The mathematical argument of the note itself was, according to the note, obtained with
    substantial AI assistance. The deviations of the formal proof from the note (see
    `fidelity`) were chosen by the formalising agent.

fidelity:
  divergences: >-
    (1) The Riesz–Sobolev inequality on the circle (Theorem 6.1 of the note, not in Mathlib)
    is replaced by a continuous Pollard inequality on the circle, proved from Pollard's theorem
    in Z/NZ by discretisation at primes N; Lemma 6.3 is then proved with the same constant 3/4.
    (2) The threshold c0 is 7 r2 instead of 3 r2, which removes the O(1) correction in the
    averaging argument of Section 8; the constant 25/74 is unchanged. (3) Theorem 1.2 is
    proved in the stronger form Leb(B ∩ [0, T]) >= (25/74) T - C, for arbitrary B (no
    measurability or B ⊆ [0, infinity) needed); the liminf is taken in the extended
    nonnegative reals. (4) Only finite limit points are considered (the point infinity plays
    no role in the measure statements). (5) Primes are indexed from p_0 = 2 and the log n
    normalisation follows Formal Conjectures; the log p_n normalisation of Merikoski is also
    covered and the two limit point sets are proved equal. (6) Merikoski's Theorem 1 is a
    hypothesis of the corollaries, not a formalised theorem.

review:
  status: "agent-reviewed"
  reviewers: ["independent read-only sub-agent (claude-opus-5-5)"]
  notes: >-
    The proofs are machine-checked (Lean kernel locally; `lake comparator --paranoid`, i.e.
    Lean kernel plus the bundled external checkers, in CI). An independent read-only agent
    audited the statements of `Challenge.lean` against the note (definitions, quantifiers,
    coercions, indexing, measure conventions, the hypotheses `merikoski`) and found them
    faithful; its presentation findings were addressed. No human review of the statements
    has been recorded yet.

alignment:
  namespace: "Erdos5"
  statements:
    - source: "Theorem 1.2"
      lean: "Erdos5.HasFourPointProperty.exists_volume_inter_Icc_ge, Erdos5.HasFourPointProperty.le_liminf_volume_inter_Icc_div"
      module: "Challenge"
      status: "proved"
    - source: "Corollary 1.3"
      lean: "Erdos5.eventually_volume_limitPointSet_inter_Icc_ge_of_merikoski (and the LogPrime and O(1) variants)"
      module: "Challenge"
      status: "proved (conditional on Merikoski's Theorem 1, as a hypothesis)"
    - source: "Theorem 1.1 (Merikoski)"
      lean: "hypothesis `merikoski` of the corollaries"
      module: "Challenge"
      status: "literature-dependency"
    - source: "Introduction: the normalisations log n and log p_n have the same limit points"
      lean: "Erdos5.limitPointSet_eq_limitPointSetLogPrime"
      module: "Challenge"
      status: "proved"
    - source: "Lemmas 2.1, 2.2, 3.1, 3.2, 4.2-4.6, 5.1-5.3, 6.3, 7.1, 7.3, Corollary 7.4, Proposition 3.3"
      lean: "see README.md (table 'Proof outline and map of the library')"
      module: "Erdos5LimitPoints"
      status: "proved"
    - source: "Theorem 6.1 (Riesz–Sobolev on the circle)"
      lean: "replaced by Erdos5.Circle.circle_pollard"
      module: "Erdos5LimitPoints.CirclePollard"
      status: "other: replaced by a different inequality that suffices for Lemma 6.3"

