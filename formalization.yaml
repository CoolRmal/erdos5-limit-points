# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Sets with Merikoski's four-point property have lower density at least 25/74 (limit points of normalised prime gaps, Erdős Problem #5)"
  description: >-
    A set B of reals has the four-point property if for all reals b1 <= b2 <= b3 <= b4 one of
    the six differences bj - bi (i < j) lies in B. Merikoski (2020) proved that the set L of
    limit points of the normalised prime gaps (p_{n+1} - p_n)/log p_n (equivalently
    /log n) has this property and
    deduced that L occupies at least one third of [0, T] for every T; this is the best known
    bound towards Erdős Problem #5, which asks whether L = [0, infinity]. This project
    formalises in Lean 4 and Mathlib a note showing that the constant 1/3 is not sharp
    asymptotically: every set B with the four-point property satisfies
    Leb*(B ∩ [0, T]) >= (25/74) T - C for a constant C and all T (Leb* = Lebesgue outer
    measure), hence
    liminf Leb*(B ∩ [0, T]) / T >= 25/74 = 1/3 + 1/222. No measurability of B is assumed. As
    corollaries, conditional on Merikoski's theorem (taken as an explicit hypothesis, not
    formalised), Leb(L ∩ [0, T]) >= (76/225) T for all large T, for both normalisations
    log n and log p_n; it is also proved unconditionally, via Chebyshev's bound, that the
    two normalisations have the same limit points. The proof formalised includes a hexagon
    lemma, a K4 labelling lemma, an additivity argument, Pollard's theorem in Z/pZ, a
    continuous Pollard inequality on the circle obtained by discretisation (used in place of
    the Riesz–Sobolev inequality of the note), a circle lemma with the sharp constant 3/4, and
    an averaging argument with an explicit power weight.
  authors:
    - "Yongxi Lin"
  responsible_maintainers:
    - "Yongxi Lin"
  license: "Apache-2.0"

